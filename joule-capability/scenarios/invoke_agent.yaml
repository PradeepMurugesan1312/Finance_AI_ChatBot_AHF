description: >
  Call this when an AHF employee or vendor asks about the status of a supplier
  invoice, payment, purchase order, or purchase requisition in SAP S/4HANA;
  wants recent invoices for a vendor; asks if a vendor is set up, or for a
  contact email or bank/IBAN details; asks if an invoice passed 3-way match;
  asks about a company code, cost centre, profit centre, or G/L account
  (master data, who owns it, is it valid, balance/activity, or budget status);
  asks a PORTFOLIO-level AP or AR question (how much is owed / outstanding,
  total payables or receivables, open item count) rather than one invoice; or
  asks an accounts-payable, accounts-receivable, procurement, tax, or finance
  policy question (approval thresholds, onboarding, payment terms, match
  tolerances, dunning/collections, tax codes). Examples: "Status of invoice
  5105601234?", "PO approval threshold?", "Balance on G/L 400000 for CC 1710?",
  "Total AP for CC 1710?", "How much are we owed in AR?", "Tax code for a
  domestic purchase?"

target:
  type: function
  name: call_agent
  parameters:
    - name: contextId
      value: $capability_context.contextId
    - name: taskId
      value: $capability_context.taskId

capability_context:
  - name: contextId
    value: $target_result.contextId
  - name: taskId
    value: $target_result.taskId
