parameters:
  - name: contextId
    optional: true
  - name: taskId
    optional: true

action_groups:
  - actions:
      # Cosmetic-looking, but present in every working reference capability —
      # do not remove.
      - type: status-update
        message: <? "Checking AHF finance systems and policy documents..." ?>

      # NOTE: the `body:` field (A2A task/context threading) was removed while
      # bringing the round trip up — a null-returning expression on the first
      # turn was failing the whole dialog function in ~0.5s (JCore-4004,
      # "Dialog function execution failed", before any request reached the
      # agent). Without `body`, every Joule turn opens a fresh A2A task; the
      # agent is stateless per turn so answers are still correct, only
      # cross-turn context ("what about payment?") is lost. Re-add once green:
      #   body: >
      #     <? contextId == null && taskId == null
      #        ? null
      #        : '{"contextId": "' + contextId + '", "taskId": "' + taskId + '"}' ?>
      - type: agent-request
        agent_type: remote
        system_alias: FinanceChatBotAgent
        result_variable: result

      - type: set-variables
        variables:
          - name: contextId
            value: <? result.body.contextId ?>
          - name: taskId
            value: <? result.body.id ?>

      # The agent writes the answer to status.message.parts[0].text (Joule's
      # BYOA default read path). It does NOT read artifacts.
      - type: message
        message:
          type: text
          content: "<? result.body.status.message.parts[0].text ?>"
          markdown: true

result:
  contextId: "<? contextId ?>"
  taskId: "<? taskId ?>"
