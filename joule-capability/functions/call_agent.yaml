parameters:
  - name: contextId
    optional: true
  - name: taskId
    optional: true

action_groups:
  - actions:
      # Cosmetic-looking, but present in every working reference capability —
      # do not remove.
      - type: status-update
        message: <? "Checking AHF finance systems and policy documents..." ?>

      # A2A task/context threading. The earlier version returned `null` on the
      # first turn (before contextId/taskId exist), which failed the whole
      # dialog function in ~0.5s (JCore-4004). Fixed: emit an empty JSON object
      # '{}' on turn 1, the real ids on every turn after. This is what makes a
      # Joule follow-up ("give me 10 more", "is it blocked?") continue the same
      # A2A task so the agent has the prior turns.
      - type: agent-request
        agent_type: remote
        system_alias: FinanceChatBotAgent
        result_variable: result
        body: >
          <? contextId == null || taskId == null
             ? '{}'
             : '{"contextId":"' + contextId + '","taskId":"' + taskId + '"}' ?>

      - type: set-variables
        variables:
          - name: contextId
            value: <? result.body.contextId ?>
          - name: taskId
            value: <? result.body.id ?>

      # The agent writes the answer to status.message.parts[0].text (Joule's
      # BYOA default read path). It does NOT read artifacts.
      - type: message
        message:
          type: text
          content: "<? result.body.status.message.parts[0].text ?>"
          markdown: true

result:
  contextId: "<? contextId ?>"
  taskId: "<? taskId ?>"
