schema_version: 3.28.0

metadata:
  namespace: joule.ext
  name: joule_ai_chatbot_finance
  version: 1.0.0
  display_name: "Joule-Ai-Chatbot-Finance"
  description: >
    Answers routine AHF finance questions — supplier invoice / payment / PO /
    purchase-requisition status, 3-way match, vendor onboarding / contact /
    bank details, company code / cost centre / profit centre / G/L account
    master data and activity, portfolio-level accounts payable and accounts
    receivable summaries (open items / amount owed or owed-to-us for a
    company code, vendor, or customer), and budget / availability-control
    status — from SAP S/4HANA (read-only), plus AP, AR, procurement, tax, and
    finance policy questions grounded in approved company documents. Also
    answers general-knowledge questions directly, clearly labelled as such.
    Escalates to a human when not confident.

system_aliases:
  # Joule → agent. Maps to the BTP destination that points at the deployed
  # Cloud Foundry route. NoAuthentication is a tracked dev gap; production
  # requires an IAS App2App (OAuth2/SAMLAssertion) trust set up by an SAP admin.
  FinanceChatBotAgent:
    destination: AHF_FINANCE_AGENT_DEV
