schema_version: 3.28.0

metadata:
  namespace: joule.ext
  name: joule_ai_chatbot_finance
  version: 1.0.0
  display_name: "Joule-Ai-Chatbot-Finance"
  description: >
    Answers routine AHF finance questions — supplier invoice / payment / PO /
    purchase-requisition status, 3-way match, vendor / bank details, company
    code / cost centre / profit centre / G/L account data, portfolio-level AP
    and AR summaries (amount owed / owed-to-us), and budget status — from SAP
    S/4HANA (read-only), plus AP, AR, procurement, tax, and finance policy
    questions grounded in approved documents. Also answers general-knowledge
    questions. Escalates to a human when not confident.

system_aliases:
  # Joule → agent. Maps to the BTP destination that points at the deployed
  # Cloud Foundry route. NoAuthentication is a tracked dev gap; production
  # requires an IAS App2App (OAuth2/SAMLAssertion) trust set up by an SAP admin.
  FinanceChatBotAgent:
    destination: AHF_FINANCE_AGENT_DEV
