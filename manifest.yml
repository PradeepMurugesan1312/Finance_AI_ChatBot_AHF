---
applications:
  - name: finance-ai-chatbot
    memory: 512M
    disk_quota: 1G
    instances: 1
    buildpacks:
      - python_buildpack
    # Route domain confirmed via `cf domains` on this org (us10-001 landscape).
    routes:
      - route: finance-ai-chatbot.cfapps.us10-001.hana.ondemand.com
    command: python -m ahf_finance_agent
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      APP_ENV: dev            # switch to "prod" once IAS App2App trust is in place
      LOG_LEVEL: INFO
      # Do NOT set PORT here — Cloud Foundry injects it per instance.

      # --- step 2: SAP Generative AI Hub / AI Core (GPT 5.2) ---------------
      MODEL_NAME: gpt-5.2
      LLM_DEPLOYMENT_ID: dcc9a836b894dc1d
      AICORE_RESOURCE_GROUP: default
      AICORE_DESTINATION_NAME: GENAICORE
      # AICORE_API_VERSION intentionally unset — the code default
      # (config.Settings.aicore_api_version) is new enough for tool calling.
      LLM_MAX_COMPLETION_TOKENS: "4096"
      LLM_TIMEOUT_SECONDS: "60"

      # --- step 3: S/4HANA (read-only OData) ------------------------------
      S4HANA_DESTINATION_NAME: S43
      # S43 destination URL is the bare host:port; the agent prepends this
      # OData service root. Set to "" if the destination URL already has it.
      S4HANA_ODATA_BASE_PATH: /sap/opu/odata/sap
      S4HANA_TIMEOUT_SECONDS: "20"
      S4HANA_MAX_TOOL_ITERATIONS: "4"

      # --- step 4: RAG policy knowledge base ------------------------------
      KB_BACKEND: local
      # Rebuild the vector index from knowledge_base/docs/ on every boot, so a
      # fresh `cf push` always ships a working KB (the index file is
      # git-ignored). With the local fallback embedding this is ~30 chunks and
      # sub-second. Set EMBEDDING_DEPLOYMENT_ID to embed via AI Core instead.
      KB_REBUILD_ON_START: "true"
      # EMBEDDING_DEPLOYMENT_ID: <text-embedding-3-small deployment id>

      # --- step 5 / 7: task persistence (threads survive `cf push`) --------
      TASK_STORE_PATH: /home/vcap/app/data/tasks.db

    # `destination-service` resolves GENAICORE + S43. `btp-connectivity` is
    # required because S43 is a ProxyType=OnPremise destination (Cloud
    # Connector) — the agent needs the on-premise proxy to reach S/4HANA.
    # Instance names below match what exists in this space (confirmed):
    #   cf create-service destination   lite  destination-service
    #   cf create-service connectivity  lite  btp-connectivity
    services:
      - destination-service
      - btp-connectivity
